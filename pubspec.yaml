name: uts_markas_endok
description: "Markas Endog - Aplikasi Manajemen Peternakan Ayam Petelur"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # === Firebase Core & Services ===
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1

  # === UI & Chart ===
  fl_chart: ^1.3.1
  google_fonts: ^9.0.0
  image: ^4.3.0

  # === Utilitas ===
  intl: ^0.20.2
  image_picker: ^1.1.2
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/asset/logo-markas-endog.png
    - lib/asset/logo-icon.png
